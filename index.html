<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF.js Viewer</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }

    #pdf-toolbar {
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 5px 10px;
      cursor: pointer;
    }

    #pdf-container {
      width: 100%;
      height: 80vh;
      border: 1px solid #ccc;
      background-color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      overflow: auto;
      position: relative;
    }

    .page-wrapper {
      position: relative;
      display: inline-block;
    }

    .annotationLayer {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <h1>PDF.js Viewer</h1>

  <div id="pdf-toolbar">
    <button id="prev-page">Previous</button>
    <span id="page-num">Page: 1 of 1</span>
    <button id="next-page">Next</button>
    <input type="range" id="page-slider" min="1" max="1" value="1" style="flex-grow: 1;" />
  </div>

  <div id="pdf-container"></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";

    const pdfPath = "./filename.pdf";

    let pdfDoc = null;
    let currentPage = 1;
    let numPages = 1;
    let renderTask = null;

    const container = document.getElementById("pdf-container");
    const pageNumEl = document.getElementById("page-num");
    const sliderEl = document.getElementById("page-slider");
    const prevBtn = document.getElementById("prev-page");
    const nextBtn = document.getElementById("next-page");

    const linkService = new pdfjsLib.SimpleLinkService();

    function updateUI() {
      pageNumEl.textContent = `Page: ${currentPage} of ${numPages}`;
      sliderEl.value = currentPage;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= numPages;
    }

    async function renderPage(pageNum) {
      if (!pdfDoc) return;

      if (renderTask) {
        try { renderTask.cancel(); } catch (e) {}
      }

      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1.5 });

      container.innerHTML = "";

      const pageWrapper = document.createElement("div");
      pageWrapper.className = "page-wrapper";
      pageWrapper.style.width = `${viewport.width}px`;
      pageWrapper.style.height = `${viewport.height}px`;

      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.display = "block";

      const canvasContext = canvas.getContext("2d");

      const annotationLayerDiv = document.createElement("div");
      annotationLayerDiv.className = "annotationLayer";
      annotationLayerDiv.style.width = `${viewport.width}px`;
      annotationLayerDiv.style.height = `${viewport.height}px`;

      pageWrapper.appendChild(canvas);
      pageWrapper.appendChild(annotationLayerDiv);
      container.appendChild(pageWrapper);

      renderTask = page.render({
        canvasContext,
        viewport
      });

      await renderTask.promise;

      const annotations = await page.getAnnotations({ intent: "display" });

      pdfjsLib.AnnotationLayer.render({
        viewport,
        div: annotationLayerDiv,
        annotations,
        page,
        linkService,
        downloadManager: null,
        renderForms: false,
        enableScripting: false
      });
    }

    pdfjsLib.getDocument(pdfPath).promise.then(async function (pdf) {
      pdfDoc = pdf;
      numPages = pdfDoc.numPages;
      sliderEl.max = numPages;
      linkService.setDocument(pdfDoc, null);

      updateUI();
      await renderPage(currentPage);
    }).catch(function (error) {
      console.error("PDF load failed:", error);
    });

    prevBtn.addEventListener("click", async function () {
      if (currentPage > 1) {
        currentPage--;
        updateUI();
        await renderPage(currentPage);
      }
    });

    nextBtn.addEventListener("click", async function () {
      if (currentPage < numPages) {
        currentPage++;
        updateUI();
        await renderPage(currentPage);
      }
    });

    sliderEl.addEventListener("input", async function () {
      currentPage = parseInt(this.value, 10);
      updateUI();
      await renderPage(currentPage);
    });
  </script>
</body>
</html>
